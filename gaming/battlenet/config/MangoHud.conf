# MangoHud (x86_64, inside muvm) for Battle.net games on Asahi.
# GPU stats/temperatures are left out: the VM has no AMD/Intel/NVIDIA sysfs or
# hwmon to read from.
gpu_name
vulkan_driver
engine_version
wine
arch
fps
frametime
frame_timing
cpu_stats
ram
resolution
position=top-left
font_scale=1.6
background_alpha=0.4
toggle_hud=Shift_R+F12
